<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Watching Private Preview</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #000; color: white; margin: 0; }
        video { max-width: 90%; margin-top: 20px; border: 1px solid #333; }
        #loading { margin-top: 100px; font-size: 1.2em; }
    </style>
</head>
<body>

    <div id="loading">Connecting to sender... please wait.</div>
    <div id="video-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>
    <script>
        const client = new WebTorrent();
        const infoHash = window.location.hash.substring(1); // Get the ID from the URL
        const loading = document.getElementById('loading');

        if (!infoHash) {
            loading.innerText = "Error: No video link detected.";
        } else {
            // Join the swarm and find the uploader
            client.add(infoHash, (torrent) => {
                loading.innerText = "Connected! Buffering video...";
                
                // Find the video file in the torrent
                const file = torrent.files.find(f => f.name.endsWith('.mp4') || f.name.endsWith('.webm') || f.name.endsWith('.mkv'));
                
                // Stream it directly to the screen
                file.appendTo('#video-container', { autoplay: true, controls: true });
                loading.style.display = 'none';
            });
        }
    </script>
</body>
</html>
